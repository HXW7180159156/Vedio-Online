<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vedio Online</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #e5e7eb;
      }
      .app {
        max-width: 900px;
        margin: 2rem auto;
        padding: 1rem;
      }
      .panel {
        display: grid;
        gap: 0.75rem;
        background: #1f2937;
        padding: 1rem;
        border-radius: 12px;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      input,
      button,
      select {
        border: 1px solid #374151;
        background: #111827;
        color: #e5e7eb;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 0.95rem;
      }
      input {
        flex: 1 1 18rem;
      }
      button {
        cursor: pointer;
        white-space: nowrap;
      }
      button:disabled,
      input:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }
      .status {
        min-height: 1.25rem;
        font-size: 0.9rem;
      }
      .status--info {
        color: #93c5fd;
      }
      .status--warning {
        color: #fcd34d;
      }
      .status--error {
        color: #fca5a5;
      }
      .hint {
        margin: 0;
        color: #9ca3af;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      video {
        width: 100%;
        margin-top: 1rem;
        border-radius: 12px;
        background: black;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>轻量磁力在线播放器</h1>
        <div class="controls">
          <input id="magnet" type="text" placeholder="输入磁力链接（magnet:?xt=urn:btih:...）" />
          <button id="playBtn" type="button">播放</button>
        </div>
        <select id="filePicker" hidden></select>
        <div id="status" class="status status--info" role="status" aria-live="polite"></div>
        <p class="hint">
          浏览器端播放依赖 WebTorrent 的 WebRTC 通道。若当前种子没有 WebRTC peers / trackers，页面会提示继续等待或建议改用桌面 BT 客户端获取直链后播放。
        </p>
      </section>
      <video id="player" controls playsinline></video>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
